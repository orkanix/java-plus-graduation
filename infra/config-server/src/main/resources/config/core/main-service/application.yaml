server:
  port: 0

statsServer:
  id: stats-server

spring:
  datasource:
    url: jdbc:postgresql://localhost:4432/main
    username: main
    password: main
  jpa:
    properties:
      hibernate:
        default_schema: public
        format_sql: false
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

logging:
  level:
    ru.practicum.ewm: DEBUG

feign:
  httpclient:
    enabled: true
