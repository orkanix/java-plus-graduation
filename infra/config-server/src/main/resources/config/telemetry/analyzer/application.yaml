grpc:
  server:
    port: 0
  client:
    hub-router:
      address: "discovery:///hub-router"
      negotiationType: plaintext

spring:
  datasource:
    url: jdbc:postgresql://localhost:1111/analyze
    username: analyze
    password: analyze
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
      dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

  kafka:
    bootstrap-servers: localhost:9092

    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      user-action-value-deserializer: ru.practicum.avro.deserializator.UserActionDeserializer
      event-similarity-value-deserializer: ru.practicum.avro.deserializator.EventSimilarityDeserializer

  topics:
    user-action-topic-name: stats.user-actions.v1
    events-similarity-topic-name: stats.events-similarity.v1

logging:
  level:
    ru.practicum.ewm: DEBUG