grpc:
  server:
    port: 0

kafka:
  bootstrap-servers: localhost:9092

  consumer:
    key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    #добавлить сериализаторы
    snapshot-value-deserializer: ru.practicum.avro.deserializer.SensorsSnapshotDeserializer
    snapshot-group-id: snapshots-analyzer-group
    #добавлить сериализаторы
    hub-event-value-deserializer: ru.practicum.avro.deserializer.HubEventDeserializer
    hub-event-group-id: hub-event-group

  topics:
    hub-topic-name: stats.user-actions.v1
    snapshots-topic-name: stats.events-similarity.v1

logging:
  level:
    ru.practicum.ewm: DEBUG