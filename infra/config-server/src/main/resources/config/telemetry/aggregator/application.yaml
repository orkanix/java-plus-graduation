grpc:
  server:
    port: 0
  client:
    hub-router:
      address: "discovery:///hub-router"
      negotiationType: plaintext

spring:
  kafka:
    bootstrap-servers: localhost:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: ru.practicum.avro.serializator.GeneralAvroSerializer

    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: ru.practicum.avro.deserializator.UserActionDeserializer

  topics:
    user-action-topic-name: stats.user-actions.v1
    events-similarity-topic-name: stats.events-similarity.v1

logging:
  level:
    ru.practicum.ewm: DEBUG