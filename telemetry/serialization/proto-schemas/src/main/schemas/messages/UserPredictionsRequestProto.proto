syntax = "proto3";

package telemetry.message.analyzer;

option java_multiple_files = true;
option java_package = "grpc.telemetry.user_request";

import "google/protobuf/timestamp.proto";

message UserPredictionsRequestProto {
  int64 user_id = 1;
  int64 max_results = 2;
}

message SimilarEventsRequestProto {
  int64 event_id = 1;
  int64 user_id = 2;
  int64 max_results = 3;
}

message InteractionsCountRequestProto {
  repeated int64 eventId = 1;
}

message RecommendedEventProto {
  int64 event_id = 1;
  double score = 2;
}
