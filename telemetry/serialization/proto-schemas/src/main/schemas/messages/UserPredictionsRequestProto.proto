syntax = "proto3";

package telemetry.message.analyzer;

option java_multiple_files = true;
option java_package = "grpc.telemetry.user_request";

import "google/protobuf/timestamp.proto";

message UserPredictionsRequestProto {
  int32 user_id = 1;
  int32 max_results = 2;
}

message SimilarEventsRequestProto {
  int32 event_id = 1;
  int32 user_id = 2;
  int32 max_results = 3;
}

message InteractionsCountRequestProto {
  int32 event_id = 1;
  double score = 2;
}

message RecommendedEventProto {
  int32 event_id = 1;
  double score = 2;
}
