syntax = "proto3";

package stats.service.collector;

option java_multiple_files = true;
option java_package = "grpc.telemetry.collector";

import "google/protobuf/empty.proto";
import "messages/UserActionProto.proto";

service UserActionController {
  rpc CollectUserAction(telemetry.message.collector.UserActionProto)
      returns (google.protobuf.Empty);
}